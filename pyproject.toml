[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "choiceone"
dynamic = ["version"]
description = "Type-safe decision layer between your Python code and any AI model (ChoiceOne protocol)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "choiceone contributors" }]
keywords = [
    "ai",
    "llm",
    "structured-output",
    "classification",
    "decisions",
    "system-one",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
local = ["torch", "transformers"]
server = ["fastapi", "uvicorn"]
anthropic = ["anthropic"]
mlflow = ["mlflow>=2.15"]
test = ["pytest", "fastapi", "uvicorn", "httpx", "mlflow>=2.15"]

[project.scripts]
choiceone-serve = "choiceone.server:main"

[tool.setuptools.packages.find]
include = ["choiceone*"]

[tool.setuptools.package-data]
choiceone = ["py.typed"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
fallback_version = "1.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
